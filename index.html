function td(){return new Date().toISOString().split('T')[0];}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d)-new Date(td()))/86400000);}
function fmtD(d){return d?new Date(d).toLocaleDateString('en-NZ',{day:'numeric',month:'short'}):''}

function dpill(d){
  var n=daysTo(d);if(n===null||!d)return '';
  var c=n<0?'#E53E3E':n===0?'#E53E3E':n<=7?'#ED8936':'#ECC94B';
  var l=n<0?('Overdue '+Math.abs(n)+'d'):n===0?'Due TODAY':('Due '+fmtD(d)+' (in '+n+'d)');
  return '<span class="dp" style="background:'+c+'22;color:'+c+'">'+l+'</span>';
}
function chip(lbl,col){return '<span class="chip" style="background:'+col+'22;color:'+col+'">'+lbl+'</span>';}

function renum(list){
  var c={};
  return list.map(function(t){
    if(t.done)return Object.assign({},t,{order:999});
    c[t.priority]=(c[t.priority]||0)+1;
    return Object.assign({},t,{order:c[t.priority]});
  });
}

function banner(msg,col){
  var b=document.getElementById('banner');
  b.textContent=msg;b.style.background=col||'#68D391';b.style.color='#0F1117';b.style.display='block';
  setTimeout(function(){b.style.display='none';},3000);
}

function chips(){
  var u=tasks.filter(function(t){return !t.done&&t.priority==='urgent';}).length;
  var d=tasks.filter(function(t){return t.done;}).length;
  var uc=document.getElementById('uc');var dc=document.getElementById('dc');
  if(u>0){uc.textContent='🔴 '+u+' urgent';uc.style.display='';}else{uc.style.display='none';}
  if(d>0){dc.textContent='✅ '+d+' done';dc.style.display='';}else{dc.style.display='none';}
}

function save(){
  try{
    localStorage.setItem('lhq-t',JSON.stringify(tasks));
    localStorage.setItem('lhq-n',JSON.stringify(dnotes));
    localStorage.setItem('lhq-p',JSON.stringify(pnotes));
    localStorage.setItem('lhq-s',new Date().toISOString());
    banner('💾 Saved — '+new Date().toLocaleTimeString('en-NZ'));
  }catch(e){banner('⚠️ Save failed','#ED8936');}
}

function sync(){
  try{
    var t=localStorage.getItem('lhq-t');
    var n=localStorage.getItem('lhq-n');
    var p=localStorage.getItem('lhq-p');
    var s=localStorage.getItem('lhq-s');
    if(t){
      tasks=JSON.parse(t);
      if(n)dnotes=JSON.parse(n);
      if(p)pnotes=JSON.parse(p);
      banner('✅ Loaded — saved '+new Date(s).toLocaleString('en-NZ'));
      render();
    }else{
      banner('No saved data found','#ED8936');
    }
  }catch(e){banner('⚠️ Could not load saved data','#ED8936');}
}

function sched(){clearTimeout(stimer);stimer=setTimeout(save,1500);}

function toggleT(id){
  tasks=renum(tasks.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done,dd:!t.done?td():''}):t;}));
  sched();render();
}
function togglePaid(id){
  var t=tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var nowPaid=!t.paid;
  tasks=tasks.map(function(x){return x.id===id?Object.assign({},x,{paid:nowPaid}):x;});
  // When marking as paid, auto-create a collection task if not already there
  // (skip if this task IS itself an auto-created collection task)
  if(nowPaid&&!t.collectFor){
    var alreadyExists=tasks.some(function(x){return x.collectFor===id;});
    if(!alreadyExists){
      var ref=t.invoiceNo||t.accountName||t.title;
      var newTask={
        id:Date.now(),
        title:'Collect items — '+ref,
        priority:'today',
        cat:'Bills & Finance',
        due:td(),
        done:false,dd:'',order:999,
        accountName:t.accountName||'',
        accountNo:t.accountNo||'',
        invoiceNo:t.invoiceNo||'',
        amount:t.amount||'',
        paid:false,collected:false,
        collectFor:id
      };
      tasks=renum(tasks.concat([newTask]));
    }
  }
  sched();render();
}
function toggleCol(id){tasks=tasks.map(function(t){return t.id===id?Object.assign({},t,{collected:!t.collected}):t;});sched();render();}

function mv(id,dir){
  var t=tasks.find(function(x){return x.id===id;});if(!t||t.done)return;
  var g=tasks.filter(function(x){return x.priority===t.priority&&!x.done;}).sort(function(a,b){return a.order-b.order;});
  var i=g.findIndex(function(x){return x.id===id;});var ni=i+dir;
  if(ni<0||ni>=g.length)return;
  var nb=g[ni];
  tasks=tasks.map(function(x){return x.id===id?Object.assign({},x,{order:nb.order}):x.id===nb.id?Object.assign({},x,{order:t.order}):x;});
  sched();render();
}

  eid=id;
  document.getElementById('et').value=t.title||'';
  document.getElementById('ep').value=t.priority||'week';
  document.getElementById('ec').value=t.cat||'General';
  document.getElementById('ed').value=t.due||'';
  document.getElementById('ea').value=t.accountName||'';
  document.getElementById('en2').value=t.accountNo||'';
  document.getElementById('ei').value=t.invoiceNo||'';
  document.getElementById('em2').value=t.amount||'';
  document.getElementById('em').style.display='flex';
}
function saveEdit(){
  if(!eid)return;
  tasks=renum(tasks.map(function(t){
    return t.id===eid?Object.assign({},t,{
      title:document.getElementById('et').value,
      priority:document.getElementById('ep').value,
      cat:document.getElementById('ec').value,
      due:document.getElementById('ed').value,
      accountName:document.getElementById('ea').value,
      accountNo:document.getElementById('en2').value,
      invoiceNo:document.getElementById('ei').value,
      amount:document.getElementById('em2').value
    }):t;
  }));
  closeModal();sched();render();
}
function delTask(){if(!eid)return;tasks=renum(tasks.filter(function(t){return t.id!==eid;}));closeModal();sched();render();}
function closeModal(){document.getElementById('em').style.display='none';eid=null;}

function trow(t){
  var pc=PC[t.priority]||'#718096';
  var isA=t.accountName&&t.accountName.toLowerCase().indexOf('auction')>=0;
  var bd='';
  if(t.accountName||t.accountNo||t.invoiceNo||t.amount){
    bd='<div class="tbill">'+(t.accountName?'<span style="color:#63B3ED">'+t.accountName+'</span>':'')+
       (t.accountNo?'<span style="color:#A0AEC0">Acct: '+t.accountNo+'</span>':'')+
       (t.invoiceNo?'<span style="color:#ECC94B;font-weight:700">Inv: #'+t.invoiceNo+'</span>':'')+
       (t.amount?'<span style="color:#68D391;font-weight:700">$'+t.amount+'</span>':'')+
       '</div>';
  }
  var ab='';
  if(isA&&!t.done){
    ab='<div class="ab">'+
      '<button onclick="event.stopPropagation();togglePaid('+t.id+')" style="background:'+(t.paid?'rgba(104,211,145,0.2)':'#20253A')+';color:'+(t.paid?'#68D391':'#718096')+'">'+(t.paid?'✅ Paid':'⬜ Paid')+'</button>'+
      '<button onclick="event.stopPropagation();toggleCol('+t.id+')" style="background:'+(t.collected?'rgba(99,179,237,0.2)':'#20253A')+';color:'+(t.collected?'#63B3ED':'#718096')+'">'+(t.collected?'📦 Collected':'⬜ Collected')+'</button>'+
      '</div>';
  } else if(isA&&t.done){
    // Show status summary only when done
    ab='<div style="display:flex;gap:6px;margin-top:4px">'+
      (t.paid?'<span style="font-size:10px;font-weight:700;background:rgba(104,211,145,0.2);color:#68D391;border-radius:4px;padding:2px 7px">✅ Paid</span>':'')+
      (t.collected?'<span style="font-size:10px;font-weight:700;background:rgba(99,179,237,0.2);color:#63B3ED;border-radius:4px;padding:2px 7px">📦 Collected</span>':'')+
      '</div>';
  }
  return '<div class="tr'+(t.done?' done':'')+'" style="border-left:3px solid '+(t.done?'#68D391':pc)+';background:'+(t.done?'rgba(104,211,145,0.05)':'rgba(0,0,0,0.15)')+'">'+
    '<div class="mv">'+(t.done?'<span style="width:28px;display:inline-block"></span>':'<button onclick="mv('+t.id+',-1)">▲</button><button onclick="mv('+t.id+',1)">▼</button>')+'</div>'+
    (!t.done?'<span class="tnum" style="color:'+pc+'">'+t.order+'</span>':'')+
    '<div class="tc" onclick="toggleT('+t.id+')">'+
      '<div class="tt'+(t.done?' done-text':'')+(t.done?' style="text-decoration:line-through;color:#718096"':'')+'">'+t.title+'</div>'+
      bd+
      '<div class="tmeta">'+(t.due?dpill(t.due):'')+
        (t.cat?'<span class="chip" style="background:#1E2333;color:#A0AEC0">'+t.cat+'</span>':'')+
        (t.done&&t.dd?'<span style="font-size:10px;color:#718096">&#10003; '+t.dd+'</span>':'')+
      '</div>'+ab+
    '</div>'+
    '<span class="tck" onclick="toggleT('+t.id+')">'+(t.done?'✅':'⬜')+'</span>'+
    '<button class="teb" onclick="openEdit('+t.id+')">✏️</button>'+
  '</div>';
}

function addForm(p,lbl){
  return '<div class="add-row"><div class="add-f">'+
    '<input id="ai-'+p+'" placeholder="Add '+lbl+' task..." onkeydown="if(event.key===\'Enter\')addT(\''+p+'\')"/>'+
    '<select id="ac-'+p+'">'+CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select>'+
    '<input id="ad-'+p+'" type="date"/>'+
    '<button class="btn btn-blue" onclick="addT(\''+p+'\')">+ Add</button>'+
  '</div></div>';
}

function sec(p,showAdd){
  var col=PC[p];var lbl=PL[p];
  var items=tasks.filter(function(t){return t.priority===p&&!t.done;}).sort(function(a,b){return a.order-b.order;});
  return '<div class="card" style="border-top:3px solid '+col+'">'+
    '<div class="ch"><span class="ct">'+lbl+'</span>'+chip(items.length+' open',col)+'</div>'+
    '<div class="cb">'+(items.length===0?'<div style="color:#718096;font-size:14px">Nothing here 🎉</div>':'')+
    items.map(trow).join('')+
    (showAdd?addForm(p,lbl):'')+
    '</div></div>';
}

var RECS={
  daily:[
    {i:'📧',t:'Check Gmail for bills',d:'Thornton Auctions full invoice number in subject line e.g. 133146-060-03',p:'high'},
    {i:'✅',t:'Work through Urgent list',d:'Anything overdue needs action today.',p:'high'},
    {i:'🎟',t:'WOW 2026 tickets',d:'Book Wed/Thu TSB Arena Wellington. Museum Hotel confirmed.',p:'medium'},
    {i:'🔑',t:'Chartwell key guy',d:'WPN8, HUC206, YS4600 + fobs. Get budget quote first.',p:'medium'}
  ],
  weekly:[
    {i:'💳',t:'Bills due this week',d:'Check both ACC and AIA income streams.',p:'high'},
    {i:'🔄',t:'Upload bank CSV Wednesday',d:'Auto-ticks paid items in HQ Budget.',p:'high'}
  ],
  monthly:[
    {i:'🏦',t:'Mortgage DDs',d:'KB -20 ($764.64) and -21 ($798.74) alternating weekly.',p:'medium'},
    {i:'🚗',t:'Vehicle maintenance',d:'Check WOF and rego in HQ Fleet.',p:'medium'}
  ],
  quarterly:[
    {i:'💰',t:'WDC Rates $858',d:'Check current quarter is paid.',p:'high'},
    {i:'🚗',t:'WPN8 respray August',d:'$1,650 budgeted — confirm booking.',p:'high'}
  ]
};

function recPanel(tab){
  var r=RECS[tab]||[];var h=r.filter(function(x){return x.p==='high';}).length;
  var col={high:'#E53E3E',medium:'#ECC94B',low:'#63B3ED'};
  return '<div class="card" style="border-top:3px solid #B794F4;margin-bottom:16px">'+
    '<div class="ch"><span class="ct">💡 Recommendations</span>'+
    '<button class="btn btn-surf btn-sm" onclick="var b=this.parentNode.nextElementSibling;b.style.display=b.style.display===\'none\'?\'block\':\'none\';this.textContent=b.style.display===\'none\'?\'▼ Show\':\'▲ Hide\'">▼ Show</button></div>'+
    '<div style="display:none">'+
    r.map(function(x){return '<div class="rec"><span style="font-size:20px;flex-shrink:0">'+x.i+'</span><div style="flex:1"><div style="font-weight:700">'+x.t+'</div><div style="font-size:13px;color:#A0AEC0;margin-top:2px">'+x.d+'</div></div>'+chip(x.p,col[x.p])+'</div>';}).join('')+
    '</div>'+
    '<div style="padding:8px 18px;font-size:12px;color:#718096">'+h+' high-priority item'+(h!==1?'s':'')+' this week</div>'+
  '</div>';
}

function doneSection(done){
  if(!done.length)return '';
  return '<div class="card"><div class="ch"><span class="ct">✅ Completed ('+done.length+')</span>'+
    '<button class="btn btn-surf btn-sm" onclick="var b=this.parentNode.nextElementSibling;b.style.display=b.style.display===\'none\'?\'block\':\'none\'">Show</button></div>'+
    '<div style="display:none" class="cb">'+done.map(trow).join('')+'</div></div>';
}

function renderDaily(){
  var urgent=tasks.filter(function(t){return t.priority==='urgent'&&!t.done;}).sort(function(a,b){return a.order-b.order;});
  var today2=tasks.filter(function(t){return t.priority==='today'&&!t.done;}).sort(function(a,b){return a.order-b.order;});
  var done=tasks.filter(function(t){return t.done;});
  var notesSec='<div class="card" style="border-left:3px solid #ECC94B">'+
    '<div class="ch"><span class="ct">📌 Notes for Dion</span>'+chip(dnotes.filter(function(n){return n.done;}).length+' done','#68D391')+'</div>'+
    '<div class="cb">'+dnotes.map(function(n){
      return '<div class="nr" style="opacity:'+(n.done?0.5:1)+'">'+
        '<span style="font-size:18px;cursor:pointer" onclick="tgNote('+n.id+')">'+(n.done?'✅':'⬜')+'</span>'+
        '<span style="flex:1;font-size:15px;color:'+(n.done?'#718096':'#A0AEC0')+';text-decoration:'+(n.done?'line-through':'none')+'">'+n.text+'</span>'+
        '</div>';
    }).join('')+'</div></div>';
  return recPanel('daily')+
    '<div style="display:flex;align-items:center;gap:12px;background:#1A1D27;border:1px solid #2D3748;border-radius:8px;padding:10px 16px;margin-bottom:14px">'+
    '<span style="font-size:20px">📱</span><div><div style="font-weight:700">Check: WhatsApp · Messenger · SMS</div><div style="color:#718096;font-size:12px">Add urgent items not yet in dashboard.</div></div></div>'+
    notesSec+sec('urgent',true)+(today2.length?sec('today',true):'')+doneSection(done);
}

function renderWeekly(){
  var open=tasks.filter(function(t){return !t.done;});
  var done=tasks.filter(function(t){return t.done;});
  var grouped=PO.filter(function(p){return open.some(function(t){return t.priority===p;});});
  return recPanel('weekly')+grouped.map(function(p){return sec(p,true);}).join('')+
    (open.length===0?'<div class="card"><div class="cb" style="text-align:center;color:#718096">All tasks complete! 🎉</div></div>':'')+doneSection(done);
}

function renderMonthly(){
  var open=tasks.filter(function(t){return !t.done;}).sort(function(a,b){var d=PO.indexOf(a.priority)-PO.indexOf(b.priority);return d!==0?d:a.order-b.order;});
  var done=tasks.filter(function(t){return t.done;});
  return recPanel('monthly')+
    '<div class="card"><div class="ch"><span class="ct">📋 All Open Tasks ('+open.length+')</span></div>'+
    '<div class="cb">'+open.map(trow).join('')+addForm('month','monthly task')+'</div></div>'+doneSection(done);
}

function renderQuarterly(){
  var low=tasks.filter(function(t){return t.priority==='low'&&!t.done;}).sort(function(a,b){return a.order-b.order;});
  var done=tasks.filter(function(t){return t.done;});
  return recPanel('quarterly')+
    '<div class="card"><div class="ch"><span class="ct">⚪ Low Priority Tasks</span></div>'+
    '<div class="cb">'+low.map(trow).join('')+addForm('low','low priority task')+'</div></div>'+doneSection(done);
}

function renderNotes(){
  return '<div class="card"><div class="ch"><span class="ct">📝 Notes</span></div><div class="cb">'+
    '<div style="display:flex;gap:8px;margin-bottom:14px">'+
    '<input id="ni" placeholder="Add a note..." onkeydown="if(event.key===\'Enter\')addNote()"/>'+
    '<button class="btn btn-blue" onclick="addNote()">+ Add</button></div>'+
    (pnotes.length===0?'<div style="color:#718096">No notes yet.</div>':'')+
    pnotes.map(function(n){
      return '<div class="nr" style="opacity:'+(n.done?0.5:1)+'">'+
        '<span style="font-size:18px;cursor:pointer" onclick="tgPN('+n.id+')">'+(n.done?'✅':'⬜')+'</span>'+
        '<span style="flex:1;font-size:15px;text-decoration:'+(n.done?'line-through':'none')+'">'+n.text+'</span>'+
        '<span style="font-size:11px;color:#718096">'+(n.createdAt||'')+'</span>'+
        '<button class="btn btn-surf btn-sm" onclick="delPN('+n.id+')" style="padding:2px 7px;margin-left:8px">✕</button>'+
        '</div>';
    }).join('')+
  '</div></div>';
}

function tgNote(id){dnotes=dnotes.map(function(n){return n.id===id?Object.assign({},n,{done:!n.done,dd:!n.done?td():''}):n;});sched();render();}
function addNote(){var el=document.getElementById('ni');var t=(el?el.value:'').trim();if(!t)return;pnotes=pnotes.concat([{id:Date.now(),text:t,done:false,dd:'',createdAt:td()}]);if(el)el.value='';sched();render();}
function tgPN(id){pnotes=pnotes.map(function(n){return n.id===id?Object.assign({},n,{done:!n.done}):n;});sched();render();}
function delPN(id){pnotes=pnotes.filter(function(n){return n.id!==id;});sched();render();}

function render(){
  var html='';
  if(cur==='daily')html=renderDaily();
  else if(cur==='weekly')html=renderWeekly();
  else if(cur==='monthly')html=renderMonthly();
  else if(cur==='quarterly')html=renderQuarterly();
  else if(cur==='notes')html=renderNotes();
  document.getElementById('content').innerHTML=html;
  chips();
}

function go(tab,btn){
  cur=tab;
  document.querySelectorAll('.tb').forEach(function(b){b.classList.remove('on');});
  if(btn)btn.classList.add('on');
  render();
}

document.getElementById('dt').textContent=new Date().toLocaleDateString('en-NZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

// Load saved data or use defaults
try{
  var st=localStorage.getItem('lhq-t');
  if(st){
    tasks=JSON.parse(st);
    var sn=localStorage.getItem('lhq-n');var sp=localStorage.getItem('lhq-p');
    if(sn)dnotes=JSON.parse(sn);else dnotes=JSON.parse(JSON.stringify(IN));
    if(sp)pnotes=JSON.parse(sp);
    var ss=localStorage.getItem('lhq-s');
    banner('✅ Loaded — last saved '+new Date(ss).toLocaleString('en-NZ'));
  }else{
    tasks=JSON.parse(JSON.stringify(IT));
    dnotes=JSON.parse(JSON.stringify(IN));
  }
}catch(e){
  tasks=JSON.parse(JSON.stringify(IT));
  dnotes=JSON.parse(JSON.stringify(IN));
}
render();
</script>
</body>
