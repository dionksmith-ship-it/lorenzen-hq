function fm(n){return '$'+(parseFloat(n)||0).toLocaleString('en-NZ',{minimumFractionDigits:2,maximumFractionDigits:2});}
function td(){return new Date().toISOString().split('T')[0];}
function dTo(d){if(!d)return null;return Math.ceil((new Date(d)-new Date(td()))/86400000);}
function fmtD(d){return d?new Date(d).toLocaleDateString('en-NZ',{day:'numeric',month:'short'}):''}
function toMo(r){var a=parseFloat(r.amount)||0;var f=r.freq;if(f==='Weekly')return a*52/12;if(f==='Fortnightly')return a*26/12;if(f==='Monthly')return a;if(f==='Quarterly')return a/3;if(f==='Annual')return a/12;return a;}
function chip(l,c){return '<span class="chip" style="background:'+c+'22;color:'+c+'">'+l+'</span>';}
function dp(d){var n=dTo(d);if(n===null||!d)return '';var c=n<0?'#E53E3E':n<=3?'#E53E3E':n<=7?'#ED8936':'#ECC94B';var l=n<0?'Overdue '+Math.abs(n)+'d':n===0?'TODAY':fmtD(d)+' (in '+n+'d)';return '<span class="due-pill" style="background:'+c+'22;color:'+c+'">Due '+l+'</span>';}

  var expRows=exp.map(function(e,i){
    return '<div class="row" style="opacity:'+(e.paid?0.6:1)+'">' +
      '<span style="font-size:18px;cursor:pointer;flex-shrink:0" onclick="toggleWkExp('+wkn+','+i+')">'+(e.paid?'✅':'⬜')+'</span>'+
      '<div style="flex:1;min-width:0"><div style="font-size:15px;text-decoration:'+(e.paid?'line-through':'none')+';color:'+(e.paid?'#718096':'#E2E8F0')+'">'+e.label+'</div>'+
      (e.note?'<div style="font-size:11px;color:#718096">'+e.note+'</div>':'')+
      '</div>'+
      chip(e.stream,e.stream==='ACC'?'#68D391':'#63B3ED')+
      '<span style="font-weight:700;color:'+(e.paid?'#718096':'#ED8936');+'font-family:inherit">'+fm(e.amount)+'</span>'+
      '</div>';
  }).join('');

  return wedBanner+
    '<div class="card" style="border-top:3px solid '+posCol+'">' +
      '<div class="ch"><span class="ct">'+getWeekDates(wkn)+'</span>'+
        '<div style="text-align:right"><div style="font-size:11px;color:#A0AEC0">POSITION</div>'+
        '<div style="font-size:20px;font-weight:800;color:'+posCol+'">'+fm(pos)+'</div>'+
        '<div style="font-size:11px;color:'+posCol+'">'+(pos>=0?'Ahead':'Behind')+'</div></div></div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #2D3748">'+
        '<button class="btn btn-sm" style="background:'+(wkn===1?'#63B3ED':'#20253A')+';color:'+(wkn===1?'#0F1117':'#A0AEC0')+'" onclick="wkn=1;render()">Week 1</button>'+
        '<button class="btn btn-sm" style="background:'+(wkn===2?'#63B3ED':'#20253A')+';color:'+(wkn===2?'#0F1117':'#A0AEC0')+'" onclick="wkn=2;render()">Week 2</button>'+
      '</div>'+
      '<div class="cb">'+
        '<div class="sgrid">'+
          '<div class="scard" style="border-top:3px solid #68D391"><div class="sl">ACC Income</div><div class="sv" style="color:#68D391">'+fm(totalInc)+'</div></div>'+
          '<div class="scard" style="border-top:3px solid #E53E3E"><div class="sl">Total Exp</div><div class="sv" style="color:#E53E3E">'+fm(totalExp)+'</div></div>'+
          '<div class="scard" style="border-top:3px solid #ECC94B"><div class="sl">Paid So Far</div><div class="sv" style="color:#ECC94B">'+fm(paidExp)+'</div></div>'+
          '<div class="scard" style="border-top:3px solid '+posCol+'"><div class="sl">Left Over</div><div class="sv" style="color:'+posCol+'">'+fm(pos)+'</div></div>'+
        '</div>'+
        expRows+
      '</div>'+
    '</div>';
}

function toggleWkExp(wk,i){wkExp[wk][i].paid=!wkExp[wk][i].paid;sched();render();}

function renderBudget(){
  var accItems=recurring.filter(function(r){return r.stream==='ACC';});
  var aiaItems=recurring.filter(function(r){return r.stream==='AIA';});
  var accMo=accItems.reduce(function(s,r){return s+toMo(r);},0);
  var aiaMo=aiaItems.reduce(function(s,r){return s+toMo(r);},0);
  var accLeft=ACC_MONTHLY-accMo;
  var aiaLeft=AIA_MONTHLY-aiaMo;

  function streamSection(items,income,label,col,left){
    var byCat=items.reduce(function(acc,r){if(!acc[r.cat])acc[r.cat]=[];acc[r.cat].push(r);return acc;},{});
    var pct=Math.min(100,Math.round(accMo/income*100));
    var catRows=Object.keys(byCat).map(function(cat){
      var rows=byCat[cat].map(function(r){
        return '<div class="row">'+
          '<div style="flex:1"><div style="font-size:15px">'+r.name+'</div>'+(r.note?'<div style="font-size:11px;color:#718096">'+r.note+'</div>':'')+
          '</div>'+chip(r.freq,'#718096')+
          '<span style="font-weight:700;color:'+col+';min-width:70px;text-align:right">'+fm(toMo(r))+'/mo</span>'+
          '<button onclick="delRec('+r.id+')" style="padding:2px 6px;font-size:11px;border:none;border-radius:4px;cursor:pointer;background:rgba(229,62,62,0.15);color:#E53E3E;font-family:inherit">✕</button>'+
          '</div>';
      }).join('');
      return '<div style="font-size:11px;font-weight:700;color:#A0AEC0;text-transform:uppercase;letter-spacing:0.5px;padding:10px 0 4px;border-bottom:1px solid #1E2333">'+cat+'</div>'+rows;
    }).join('');
    return '<div class="card" style="border-top:3px solid '+col+'">'+
      '<div class="ch"><span class="ct">'+label+'</span><div style="text-align:right">'+
        '<div style="font-size:11px;color:#A0AEC0">INCOME</div>'+
        '<div style="font-size:16px;font-weight:800;color:'+col+'">'+fm(income)+'/mo</div></div></div>'+
      '<div class="cb">'+
        '<div class="sgrid">'+
          '<div class="scard"><div class="sl">Committed</div><div class="sv" style="color:#E53E3E">'+fm(items.reduce(function(s,r){return s+toMo(r);},0))+'/mo</div></div>'+
          '<div class="scard"><div class="sl">Remaining</div><div class="sv" style="color:'+(left>=0?'#68D391':'#E53E3E')+'">'+fm(left)+'/mo</div></div>'+
        '</div>'+
        '<div class="pbar"><div class="pfill" style="width:'+Math.min(100,items.reduce(function(s,r){return s+toMo(r);},0)/income*100)+'%;background:'+col+'"></div></div>'+
        catRows+
        (left<0?'<div style="margin-top:12px;padding:10px;background:rgba(229,62,62,0.1);border-radius:8px;font-size:13px;color:#E53E3E">Over budget by '+fm(Math.abs(left))+'/mo</div>':'')+
      '</div></div>';
  }

  var addRow='<div class="card" style="padding:14px 18px">'+
    '<div style="font-size:11px;font-weight:700;color:#A0AEC0;text-transform:uppercase;margin-bottom:10px">+ Add Bill / Subscription</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<input id="rname" placeholder="Name" style="flex:2 1 140px"/>'+
    '<input id="ramt" placeholder="Amount $" style="width:80px"/>'+
    '<select id="rfreq" style="width:110px"><option>Weekly</option><option>Fortnightly</option><option selected>Monthly</option><option>Quarterly</option><option>Annual</option></select>'+
    '<select id="rstream" style="width:80px"><option>ACC</option><option>AIA</option></select>'+
    '<input id="rcat" placeholder="Category" style="flex:1 1 100px"/>'+
    '<button class="btn btn-green" onclick="addRec()">+ Add</button>'+
    '</div></div>';

  return streamSection(accItems,ACC_MONTHLY,'💚 ACC Income Stream','#68D391',accLeft)+
         streamSection(aiaItems,AIA_MONTHLY,'💙 AIA Income Stream','#63B3ED',aiaLeft)+
         addRow;
}

function addRec(){
  var n=document.getElementById('rname').value.trim();if(!n)return;
  var r={id:Date.now(),name:n,amount:parseFloat(document.getElementById('ramt').value)||0,
    freq:document.getElementById('rfreq').value,stream:document.getElementById('rstream').value,
    cat:document.getElementById('rcat').value||'Other'};
  recurring.push(r);sched();render();
}
function delRec(id){recurring=recurring.filter(function(r){return r.id!==id;});sched();render();}

function renderBanking(){
  var sorted=[].concat(upcoming).sort(function(a,b){return (a.due||'9999').localeCompare(b.due||'9999');});
  var acc=sorted.filter(function(u){return u.stream==='ACC'&&!u.paid;});
  var aia=sorted.filter(function(u){return u.stream==='AIA'&&!u.paid;});
  var done=upcoming.filter(function(u){return u.paid;});
  var totalOut=upcoming.filter(function(u){return !u.paid;}).reduce(function(s,u){return s+(parseFloat(u.amount)||0);},0);
  var bal=parseFloat(balance)||0;

  function upRow(u){
    var d=dTo(u.due);var c=d===null?'#718096':d<0?'#E53E3E':d<=3?'#E53E3E':d<=7?'#ED8936':'#718096';
    return '<div class="row" style="opacity:'+(u.paid?0.5:1)+';border-left:3px solid '+(u.paid?'#68D391':c)+';padding-left:10px">'+
      '<span style="font-size:18px;cursor:pointer;flex-shrink:0" onclick="toggleUp('+u.id+')">'+(u.paid?'✅':'⬜')+'</span>'+
      '<div style="flex:1;cursor:pointer" onclick="toggleUp('+u.id+')">'+
        '<div style="font-size:15px;text-decoration:'+(u.paid?'line-through':'none')+';color:'+(u.paid?'#718096':'#E2E8F0')+'">'+u.name+'</div>'+
        (u.due?'<div style="font-size:11px;color:'+c+'">Due '+fmtD(u.due)+(d!==null?' (in '+d+'d)':'')+'</div>':'')+
      '</div>'+
      '<span style="font-weight:700;color:'+(u.paid?'#718096':'#ED8936')+'">'+fm(u.amount)+'</span>'+
      '<button onclick="delUp('+u.id+')" style="padding:2px 6px;font-size:11px;border:none;border-radius:4px;cursor:pointer;background:rgba(229,62,62,0.15);color:#E53E3E;font-family:inherit">✕</button>'+
      '</div>';
  }

  var addUp='<div style="margin-top:12px;padding-top:12px;border-top:1px solid #1E2333">'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<input id="uname" placeholder="Payment name" style="flex:2 1 140px"/>'+
    '<input id="uamt" placeholder="Amount $" style="width:80px"/>'+
    '<input id="udue" type="date" style="width:140px"/>'+
    '<select id="ustream" style="width:80px"><option>ACC</option><option>AIA</option></select>'+
    '<button class="btn btn-green" onclick="addUp()">+ Add</button>'+
    '</div></div>';

  return '<div class="card" style="border-top:3px solid #63B3ED">'+
    '<div class="ch"><span class="ct">🏦 Kiwibank Balance</span></div>'+
    '<div class="cb">'+
      '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'+
        '<div><div style="font-size:11px;color:#718096;margin-bottom:6px">Current balance</div>'+
          '<div style="display:flex;gap:8px;align-items:center"><span style="font-size:20px;color:#718096">$</span>'+
          '<input style="width:120px;font-size:18px;font-weight:700" value="'+balance+'" oninput="balance=this.value;sched();renderBanking2()"/></div></div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:11px;color:#718096">UPCOMING OUTGOING</div>'+
          '<div style="font-size:20px;font-weight:800;color:#E53E3E">'+fm(totalOut)+'</div>'+
          '<div style="font-size:11px;color:'+(bal-totalOut>=0?'#68D391':'#E53E3E')+'">'+(bal-totalOut>=0?'Will cover':'Short by '+fm(Math.abs(bal-totalOut)))+'</div>'+
        '</div>'+
      '</div>'+
    '</div></div>'+
    '<div class="card">'+
      '<div class="ch"><span class="ct">💚 Upcoming — ACC Income pays</span>'+chip(fm(acc.reduce(function(s,u){return s+u.amount;},0))+' outstanding','#68D391')+'</div>'+
      '<div class="cb">'+(acc.length===0?'<div style="color:#718096">All clear! 🎉</div>':acc.map(upRow).join(''))+addUp+'</div></div>'+
    '<div class="card">'+
      '<div class="ch"><span class="ct">💙 Upcoming — AIA Income pays</span>'+chip(fm(aia.reduce(function(s,u){return s+u.amount;},0))+' outstanding','#63B3ED')+'</div>'+
      '<div class="cb">'+(aia.length===0?'<div style="color:#718096">All clear! 🎉</div>':aia.map(upRow).join(''))+'</div></div>'+
    '<div class="card">'+
      '<div class="ch"><span class="ct">📊 Loan & Debt Tracker</span>'+chip(fm(DEBTS.reduce(function(s,d){return s+(d.remaining||0);},0))+' total','#B794F4')+'</div>'+
      '<div class="cb">'+DEBTS.map(function(d){
        return '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #1E2333">'+
          '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
            '<div><div style="font-weight:700;font-size:15px">'+d.name+'</div><div style="font-size:12px;color:#718096;margin-top:2px">'+d.note+'</div></div>'+
            '<div style="text-align:right">'+
              (d.remaining>0?'<div style="font-size:15px;font-weight:800;color:'+d.col+'">'+fm(d.remaining)+' remaining</div>':'')+
              '<div style="font-size:12px;color:#A0AEC0">'+fm(d.repayment)+' / '+d.freq+'</div>'+
              (d.rate>0?'<div style="font-size:11px;color:#718096">'+d.rate+'% p.a.</div>':'')+
            '</div>'+
          '</div>'+
          '</div>';
      }).join('')+'</div></div>'+
    (done.length?'<div class="card"><div class="ch"><span class="ct">✅ Paid ('+done.length+')</span>'+
      '<button class="btn btn-surf btn-sm" onclick="var b=this.nextElementSibling;b.style.display=b.style.display===\'none\'?\'block\':\'none\'">Show</button></div>'+
      '<div style="display:none" class="cb">'+done.map(upRow).join('')+'</div></div>':'');
}

function renderBanking2(){document.getElementById('content').innerHTML=renderBanking();}
function toggleUp(id){upcoming=upcoming.map(function(u){return u.id===id?Object.assign({},u,{paid:!u.paid}):u;});sched();render();}
function delUp(id){upcoming=upcoming.filter(function(u){return u.id!==id;});sched();render();}
function addUp(){var n=document.getElementById('uname').value.trim();if(!n)return;upcoming.push({id:Date.now(),name:n,amount:parseFloat(document.getElementById('uamt').value)||0,due:document.getElementById('udue').value,stream:document.getElementById('ustream').value,paid:false});sched();render();}

function renderHistory(){
  var qs=Object.keys(HIST);
  var qBtns=qs.map(function(q){var t=Object.values(HIST[q]).reduce(function(s,m){return s+m.total;},0);return '<button class="btn btn-sm" style="background:'+(selQ===q?'#63B3ED':'#20253A')+';color:'+(selQ===q?'#0F1117':'#A0AEC0')+'" onclick="selQ=\''+q+'\';selM=null;render()">'+q+' '+fm(t)+'</button>';}).join('');
  var mBtns='';
  if(selQ){var ms=Object.keys(HIST[selQ]);mBtns=ms.map(function(m){return '<button class="btn btn-sm" style="background:'+(selM===m?'#B794F4':'#20253A')+';color:'+(selM===m?'#0F1117':'#A0AEC0')+'" onclick="selM=\''+m+'\';render()">'+m+' '+fm(HIST[selQ][m].total)+'</button>';}).join('');}
  var items='';
  if(selQ&&selM){var d=HIST[selQ][selM];items='<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-weight:700;font-size:16px">'+selM+'</span><span style="font-weight:800;font-size:18px;color:#E53E3E">'+fm(d.total)+'</span></div>'+d.items.map(function(it){return '<div class="row"><span style="flex:1">'+it.n+'</span><span style="font-weight:700;color:#ED8936">'+fm(it.a)+'</span></div>';}).join('')+'</div>';}
  return '<div class="card"><div class="ch"><span class="ct">📅 Expense History — Aug 2024 to Jun 2026</span></div><div class="cb">'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+qBtns+'</div>'+
    (mBtns?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+mBtns+'</div>':'')+
    (items||(!selQ?'<div style="color:#718096">Select a quarter above.</div>':''))+
    '</div></div>';
}

function render(){
  var html='';
  if(cur==='wkbudget')html=renderWkBudget();
  else if(cur==='budget')html=renderBudget();
  else if(cur==='banking')html=renderBanking();
  else if(cur==='history')html=renderHistory();
  document.getElementById('content').innerHTML=html;
}

function go(tab,btn){cur=tab;document.querySelectorAll('.tb').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');render();}

document.getElementById('dt').textContent=new Date().toLocaleDateString('en-NZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
try{var d=localStorage.getItem('lhq-budget');if(d){var p=JSON.parse(d);if(p.wkExp)wkExp=p.wkExp;if(p.upcoming)upcoming=p.upcoming;if(p.recurring)recurring=p.recurring;if(p.balance)balance=p.balance;}}catch(e){}
render();
</script>
</body>
